<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" width="1040" height="490" role="img" aria-label="The auditor uses the web app, which saves requests to the database. The worker takes requests from the database, calls the Claude AI and reads approved websites, and saves everything back. A researcher downloads documents from sites that block automated access and imports them into the database.">
  <title>Mira: the system at a glance</title>
  <style>
    text { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .n { fill: #ffffff; stroke: #18211e; stroke-width: 1.5; }
    .n.model { fill: #ecedfb; stroke: #4347c4; }
    .n.human { fill: #fbf1e3; stroke: #a3600d; stroke-dasharray: 5 3; }
    .n.store { fill: #e3f2ef; stroke: #0d6f63; }
    .n.ok { fill: #ffffff; stroke: #2b7a33; stroke-width: 2; }
    .n.stop { fill: #fbeaea; stroke: #b0383a; }
    .zone { fill: none; stroke: #56635d; stroke-dasharray: 4 4; stroke-width: 1; }
    .t { font-size: 14px; font-weight: 600; fill: #18211e; }
    .s { font-size: 12px; fill: #56635d; }
    .tag { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; }
    .tag.model { fill: #4347c4; } .tag.code { fill: #18211e; } .tag.human { fill: #a3600d; } .tag.store { fill: #0d6f63; }
    .a { stroke: #18211e; stroke-width: 1.4; fill: none; }
    .a.loop { stroke: #a3600d; stroke-dasharray: 5 3; }
    .a.fail { stroke: #b0383a; }
    .a.ok { stroke: #2b7a33; }
    .al { font-size: 12px; fill: #56635d; }
    .al.loop { fill: #a3600d; } .al.fail { fill: #b0383a; } .al.ok { fill: #2b7a33; }
    .h { font-size: 18px; font-weight: 600; fill: #18211e; }
    .key { font-size: 12px; fill: #56635d; }
    marker path { fill: #18211e; }
    marker.loop path { fill: #a3600d; }
    marker.fail path { fill: #b0383a; }
    marker.ok path { fill: #2b7a33; }
  </style>
  <rect class="bg" x="0" y="0" width="1040" height="490"/>
  <text class="h" x="20" y="32">Mira: the system at a glance</text>
  <g transform="translate(20,50)">
      <defs>
        <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
      <rect class="n human" x="15" y="150" width="130" height="80" rx="4"/>
      <text class="t" x="80" y="182" text-anchor="middle">Auditor</text>
      <text class="s" x="80" y="200" text-anchor="middle">asks, reviews, signs off</text>
      <text class="tag human" x="80" y="219" text-anchor="middle">PERSON</text>

      <rect class="n" x="195" y="150" width="160" height="80" rx="4"/>
      <text class="t" x="275" y="182" text-anchor="middle">Web app</text>
      <text class="s" x="275" y="200" text-anchor="middle">brief · progress · review</text>
      <text class="tag code" x="275" y="219" text-anchor="middle">CODE · NO AI ACCESS</text>

      <rect class="n store" x="410" y="115" width="180" height="150" rx="4"/>
      <text class="t" x="500" y="148" text-anchor="middle">Database</text>
      <text class="s" x="500" y="172" text-anchor="middle">requests waiting to run</text>
      <text class="s" x="500" y="190" text-anchor="middle">saved pages and passages</text>
      <text class="s" x="500" y="208" text-anchor="middle">claims, checks, reports</text>
      <text class="s" x="500" y="226" text-anchor="middle">log of every step</text>
      <text class="tag store" x="500" y="252" text-anchor="middle">EVIDENCE + AUDIT TRAIL</text>

      <rect class="n" x="645" y="150" width="150" height="80" rx="4"/>
      <text class="t" x="720" y="182" text-anchor="middle">Worker</text>
      <text class="s" x="720" y="200" text-anchor="middle">runs the agents</text>
      <text class="tag code" x="720" y="219" text-anchor="middle">CODE · HOLDS AI KEY</text>

      <rect class="n model" x="850" y="45" width="140" height="70" rx="4"/>
      <text class="t" x="920" y="74" text-anchor="middle">Claude AI</text>
      <text class="s" x="920" y="92" text-anchor="middle">reads and drafts</text>
      <text class="tag model" x="920" y="107" text-anchor="middle">AI</text>

      <rect class="n" x="850" y="265" width="140" height="70" rx="4"/>
      <text class="t" x="920" y="294" text-anchor="middle">Approved sites</text>
      <text class="s" x="920" y="312" text-anchor="middle">HKMA, SFC and others</text>
      <text class="tag code" x="920" y="327" text-anchor="middle">ALLOW-LIST ONLY</text>

      <rect class="n human" x="410" y="315" width="180" height="70" rx="4"/>
      <text class="t" x="500" y="343" text-anchor="middle">Manual import</text>
      <text class="s" x="500" y="361" text-anchor="middle">MAS, statutes (block bots)</text>
      <text class="tag human" x="500" y="376" text-anchor="middle">PERSON + CODE</text>

      <line class="a" x1="145" y1="190" x2="193" y2="190" marker-end="url(#m1)"/>
      <line class="a" x1="355" y1="178" x2="408" y2="178" marker-end="url(#m1)"/>
      <text class="al" x="382" y="168" text-anchor="middle">request</text>
      <line class="a" x1="408" y1="206" x2="357" y2="206" marker-end="url(#m1)"/>
      <text class="al" x="382" y="226" text-anchor="middle">report</text>
      <line class="a" x1="590" y1="178" x2="643" y2="178" marker-end="url(#m1)"/>
      <text class="al" x="617" y="168" text-anchor="middle">picks up</text>
      <line class="a" x1="643" y1="206" x2="592" y2="206" marker-end="url(#m1)"/>
      <text class="al" x="617" y="226" text-anchor="middle">saves all</text>
      <line class="a" x1="795" y1="165" x2="848" y2="100" marker-end="url(#m1)"/>
      <line class="a" x1="795" y1="215" x2="848" y2="280" marker-end="url(#m1)"/>
      <line class="a" x1="500" y1="315" x2="500" y2="267" marker-end="url(#m1)"/>
    </g>
  <g transform="translate(20,464.0)"><rect class="n model" x="0" y="0" width="18" height="12" rx="2"/><text class="key" x="26" y="10">AI step</text><rect class="n" x="110" y="0" width="18" height="12" rx="2"/><text class="key" x="136" y="10">Code step</text><rect class="n human" x="220" y="0" width="18" height="12" rx="2"/><text class="key" x="246" y="10">Person</text><rect class="n store" x="330" y="0" width="18" height="12" rx="2"/><text class="key" x="356" y="10">Data</text></g>
</svg>
