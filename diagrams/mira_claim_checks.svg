<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" width="1040" height="390" role="img" aria-label="A claim goes to the quote check. If the quote is not in the saved source, the claim is rejected. If it is, a separate AI checks the meaning. Supported claims go into the report. Partly supported claims get one rewrite and are checked again. Anything else is unresolved and listed under limitations.">
  <title>Mira: how a statement earns a place in the report</title>
  <style>
    text { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .n { fill: #ffffff; stroke: #18211e; stroke-width: 1.5; }
    .n.model { fill: #ecedfb; stroke: #4347c4; }
    .n.human { fill: #fbf1e3; stroke: #a3600d; stroke-dasharray: 5 3; }
    .n.store { fill: #e3f2ef; stroke: #0d6f63; }
    .n.ok { fill: #ffffff; stroke: #2b7a33; stroke-width: 2; }
    .n.stop { fill: #fbeaea; stroke: #b0383a; }
    .zone { fill: none; stroke: #56635d; stroke-dasharray: 4 4; stroke-width: 1; }
    .t { font-size: 14px; font-weight: 600; fill: #18211e; }
    .s { font-size: 12px; fill: #56635d; }
    .tag { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; }
    .tag.model { fill: #4347c4; } .tag.code { fill: #18211e; } .tag.human { fill: #a3600d; } .tag.store { fill: #0d6f63; }
    .a { stroke: #18211e; stroke-width: 1.4; fill: none; }
    .a.loop { stroke: #a3600d; stroke-dasharray: 5 3; }
    .a.fail { stroke: #b0383a; }
    .a.ok { stroke: #2b7a33; }
    .al { font-size: 12px; fill: #56635d; }
    .al.loop { fill: #a3600d; } .al.fail { fill: #b0383a; } .al.ok { fill: #2b7a33; }
    .h { font-size: 18px; font-weight: 600; fill: #18211e; }
    .key { font-size: 12px; fill: #56635d; }
    marker path { fill: #18211e; }
    marker.loop path { fill: #a3600d; }
    marker.fail path { fill: #b0383a; }
    marker.ok path { fill: #2b7a33; }
  </style>
  <rect class="bg" x="0" y="0" width="1040" height="390"/>
  <text class="h" x="20" y="32">Mira: how a statement earns a place in the report</text>
  <g transform="translate(20,50)">
      <defs>
        <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="m3l" class="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="m3f" class="fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="m3o" class="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
      <rect class="n model" x="20" y="100" width="170" height="72" rx="4"/>
      <text class="t" x="105" y="130" text-anchor="middle">Claim</text>
      <text class="s" x="105" y="148" text-anchor="middle">with its quoted source</text>

      <rect class="n" x="250" y="100" width="190" height="72" rx="4"/>
      <text class="t" x="345" y="128" text-anchor="middle">Quote check</text>
      <text class="s" x="345" y="146" text-anchor="middle">are these words in the source?</text>
      <text class="tag code" x="345" y="163" text-anchor="middle">CODE</text>

      <rect class="n model" x="500" y="100" width="190" height="72" rx="4"/>
      <text class="t" x="595" y="128" text-anchor="middle">Meaning check</text>
      <text class="s" x="595" y="146" text-anchor="middle">does the source say this?</text>
      <text class="tag model" x="595" y="163" text-anchor="middle">SEPARATE AI</text>

      <rect class="n ok" x="790" y="100" width="190" height="72" rx="4"/>
      <text class="t" x="885" y="132" text-anchor="middle">In the report</text>
      <text class="s" x="885" y="150" text-anchor="middle">with citation and link</text>

      <rect class="n stop" x="500" y="225" width="300" height="60" rx="4"/>
      <text class="t" x="650" y="250" text-anchor="middle">Unresolved</text>
      <text class="s" x="650" y="268" text-anchor="middle">listed under limitations, never stated as fact</text>

      <rect class="n model" x="500" y="10" width="190" height="50" rx="4"/>
      <text class="t" x="595" y="40" text-anchor="middle">One rewrite</text>

      <line class="a" x1="190" y1="136" x2="248" y2="136" marker-end="url(#m3)"/>
      <line class="a" x1="440" y1="136" x2="498" y2="136" marker-end="url(#m3)"/>
      <text class="al" x="469" y="128" text-anchor="middle">found</text>
      <line class="a ok" x1="690" y1="136" x2="788" y2="136" marker-end="url(#m3o)"/>
      <text class="al ok" x="739" y="128" text-anchor="middle">supported</text>
      <path class="a loop" d="M560 100 V62" marker-end="url(#m3l)"/>
      <text class="al loop" x="552" y="86" text-anchor="end">partly supported</text>
      <path class="a loop" d="M630 62 V98" marker-end="url(#m3l)"/>
      <text class="al loop" x="638" y="86">check again</text>
      <path class="a fail" d="M345 172 V255 H498" marker-end="url(#m3f)"/>
      <text class="al fail" x="353" y="200">not found</text>
      <line class="a fail" x1="595" y1="172" x2="595" y2="223" marker-end="url(#m3f)"/>
      <text class="al fail" x="603" y="205">unsupported or contradicted</text>
    </g>
  <g transform="translate(20,364.0)"><rect class="n model" x="0" y="0" width="18" height="12" rx="2"/><text class="key" x="26" y="10">AI step</text><rect class="n" x="110" y="0" width="18" height="12" rx="2"/><text class="key" x="136" y="10">Code step</text></g>
</svg>
