<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="Top row: brief, plan, gather sources, completeness check. If expected sources are missing, go back to gather. Bottom row: draft claims, check claims, write report, human review. Claims that fail the check are listed as unresolved.">
  <title>Mira: what happens in one run</title>
  <style>
    text { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .n { fill: #ffffff; stroke: #18211e; stroke-width: 1.5; }
    .n.model { fill: #ecedfb; stroke: #4347c4; }
    .n.human { fill: #fbf1e3; stroke: #a3600d; stroke-dasharray: 5 3; }
    .n.store { fill: #e3f2ef; stroke: #0d6f63; }
    .n.ok { fill: #ffffff; stroke: #2b7a33; stroke-width: 2; }
    .n.stop { fill: #fbeaea; stroke: #b0383a; }
    .zone { fill: none; stroke: #56635d; stroke-dasharray: 4 4; stroke-width: 1; }
    .t { font-size: 14px; font-weight: 600; fill: #18211e; }
    .s { font-size: 12px; fill: #56635d; }
    .tag { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; }
    .tag.model { fill: #4347c4; } .tag.code { fill: #18211e; } .tag.human { fill: #a3600d; } .tag.store { fill: #0d6f63; }
    .a { stroke: #18211e; stroke-width: 1.4; fill: none; }
    .a.loop { stroke: #a3600d; stroke-dasharray: 5 3; }
    .a.fail { stroke: #b0383a; }
    .a.ok { stroke: #2b7a33; }
    .al { font-size: 12px; fill: #56635d; }
    .al.loop { fill: #a3600d; } .al.fail { fill: #b0383a; } .al.ok { fill: #2b7a33; }
    .h { font-size: 18px; font-weight: 600; fill: #18211e; }
    .key { font-size: 12px; fill: #56635d; }
    marker path { fill: #18211e; }
    marker.loop path { fill: #a3600d; }
    marker.fail path { fill: #b0383a; }
    marker.ok path { fill: #2b7a33; }
  </style>
  <rect class="bg" x="0" y="0" width="1040" height="420"/>
  <text class="h" x="20" y="32">Mira: what happens in one run</text>
  <g transform="translate(20,50)">
      <defs>
        <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="m2l" class="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="m2f" class="fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
      <path class="a loop" d="M880 60 V28 H625 V58" marker-end="url(#m2l)"/>
      <text class="al loop" x="752" y="20" text-anchor="middle">sources still missing → gather again</text>

      <rect class="n human" x="20" y="60" width="200" height="72" rx="4"/>
      <text class="t" x="120" y="88" text-anchor="middle">1 · Brief</text>
      <text class="s" x="120" y="106" text-anchor="middle">topic, markets, period</text>
      <text class="tag human" x="120" y="123" text-anchor="middle">AUDITOR</text>

      <rect class="n model" x="270" y="60" width="200" height="72" rx="4"/>
      <text class="t" x="370" y="88" text-anchor="middle">2 · Plan</text>
      <text class="s" x="370" y="106" text-anchor="middle">which sources to read</text>
      <text class="tag model" x="370" y="123" text-anchor="middle">AI · CHECKED BY CODE</text>

      <rect class="n model" x="525" y="60" width="200" height="72" rx="4"/>
      <text class="t" x="625" y="88" text-anchor="middle">3 · Gather</text>
      <text class="s" x="625" y="106" text-anchor="middle">scouts per market, in parallel</text>
      <text class="tag model" x="625" y="123" text-anchor="middle">AI PICKS · CODE FETCHES</text>

      <rect class="n" x="780" y="60" width="200" height="72" rx="4"/>
      <text class="t" x="880" y="88" text-anchor="middle">4 · Completeness</text>
      <text class="s" x="880" y="106" text-anchor="middle">checklist vs. what was read</text>
      <text class="tag code" x="880" y="123" text-anchor="middle">CODE</text>

      <line class="a" x1="220" y1="96" x2="268" y2="96" marker-end="url(#m2)"/>
      <line class="a" x1="470" y1="96" x2="523" y2="96" marker-end="url(#m2)"/>
      <line class="a" x1="725" y1="96" x2="778" y2="96" marker-end="url(#m2)"/>
      <line class="a" x1="880" y1="132" x2="880" y2="188" marker-end="url(#m2)"/>

      <rect class="n model" x="780" y="190" width="200" height="72" rx="4"/>
      <text class="t" x="880" y="218" text-anchor="middle">5 · Draft claims</text>
      <text class="s" x="880" y="236" text-anchor="middle">from saved passages only</text>
      <text class="tag model" x="880" y="253" text-anchor="middle">AI</text>

      <rect class="n" x="525" y="190" width="200" height="72" rx="4"/>
      <text class="t" x="625" y="218" text-anchor="middle">6 · Check claims</text>
      <text class="s" x="625" y="236" text-anchor="middle">quote check, then meaning</text>
      <text class="tag code" x="625" y="253" text-anchor="middle">CODE + SEPARATE AI</text>

      <rect class="n model" x="270" y="190" width="200" height="72" rx="4"/>
      <text class="t" x="370" y="218" text-anchor="middle">7 · Write report</text>
      <text class="s" x="370" y="236" text-anchor="middle">only verified claims</text>
      <text class="tag model" x="370" y="253" text-anchor="middle">AI · CHECKED BY CODE</text>

      <rect class="n human" x="20" y="190" width="200" height="72" rx="4"/>
      <text class="t" x="120" y="218" text-anchor="middle">8 · Review, sign-off</text>
      <text class="s" x="120" y="236" text-anchor="middle">decision on each finding</text>
      <text class="tag human" x="120" y="253" text-anchor="middle">REVIEWER</text>

      <line class="a" x1="780" y1="226" x2="727" y2="226" marker-end="url(#m2)"/>
      <line class="a" x1="525" y1="226" x2="472" y2="226" marker-end="url(#m2)"/>
      <line class="a" x1="270" y1="226" x2="222" y2="226" marker-end="url(#m2)"/>
      <line class="a fail" x1="625" y1="262" x2="625" y2="298" marker-end="url(#m2f)"/>
      <text class="al fail" x="635" y="316">failed claims → listed as "unresolved", not reported as fact</text>
    </g>
  <g transform="translate(20,394.0)"><rect class="n model" x="0" y="0" width="18" height="12" rx="2"/><text class="key" x="26" y="10">AI step</text><rect class="n" x="110" y="0" width="18" height="12" rx="2"/><text class="key" x="136" y="10">Code step</text><rect class="n human" x="220" y="0" width="18" height="12" rx="2"/><text class="key" x="246" y="10">Person</text></g>
</svg>
