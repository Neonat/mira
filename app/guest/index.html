<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co http://127.0.0.1:*; frame-src blob:; base-uri 'none'; form-action 'none'">
  <title>Mira | Guest report</title>
  <link rel="stylesheet" href="guest.css">
  <script src="guest.js" defer></script>
</head>
<body>
  <main>
    <div class="brand">Mira</div>
    <h1 id="title">Guest report</h1>
    <p id="scope" hidden></p>
    <p id="window" hidden></p>
    <p id="status" role="status" aria-live="polite">Checking guest access…</p>
    <progress id="loading" aria-label="Preparing your report" hidden></progress>
    <ul id="markets" hidden></ul>
    <div class="actions">
      <button id="generate" type="button" hidden>Generate report</button>
      <button id="open" type="button" aria-haspopup="dialog" hidden>Open preview</button>
      <a id="download" class="secondary-action" aria-label="Download HTML" download="mira-draft-report.html" hidden>Download</a>
    </div>
    <iframe id="report" title="Mira draft report" sandbox="allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
  </main>
  <dialog id="reader" aria-labelledby="reader-title">
    <header>
      <h2 id="reader-title">Report preview</h2>
      <button id="close-reader" class="secondary-action" type="button" autofocus>Close</button>
    </header>
    <iframe id="reader-report" title="Mira draft report preview" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
  </dialog>
</body>
</html>
