<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co http://127.0.0.1:*; frame-src blob:; base-uri 'none'; form-action 'none'">
  <title>Mira | Guest report</title>
  <link rel="stylesheet" href="review-theme.css">
  <link rel="stylesheet" href="guest-landing.css">
  <script src="guest.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <span class="brand">Mira</span>
    </div>
  </header>
  <main class="wrap">
    <div class="hero">
      <div>
        <h1 id="title">Guest report</h1>
        <p id="scope" hidden></p>
      </div>
    </div>
    <section class="sheet guest-panel" aria-label="Guest report access">
      <p id="window" hidden></p>
      <p id="status" role="status" aria-live="polite">Checking guest access…</p>
      <div class="guest-actions">
        <button id="generate" class="primary" type="button" hidden>Generate report</button>
        <button id="open" class="primary" type="button" hidden>Open report</button>
        <a id="download" class="secondary-action" download="mira-draft-report.html" hidden>Download HTML</a>
      </div>
    </section>
    <iframe id="report" title="Mira draft report" sandbox="allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
  </main>
</body>
</html>
