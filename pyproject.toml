[project]
name = "mira"
version = "0.1.0"
description = "Agentic external driver research for internal audit (MVP)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "pypdf==6.21.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.64,<2"]
dev = ["pytest>=8"]
llm = ["anthropic>=2.3", "openai>=3.46"]
ui = ["streamlit[pdf]==1.66.0", "supabase>=2.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mira", "mira.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
